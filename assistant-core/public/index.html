<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REBECA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.43.5/dist/force-graph.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js"></script>
<style>
  :root {
    --bg: #0d0d0d; --panel: #151515; --panel2: #0f0f0f;
    --border: #2c2c2c; --border-hi: #3d3d3d; --line: #d8d8d8;
    --text: #ededed; --muted: #8a8a80;
    --lime: #bcbf56; --coral: #f27e63; --terra: #bf6550; --olive: #71734c;
    --ok: #bcbf56; --err: #f27e63;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 100dvh;
  }
  ::selection { background: var(--lime); color: #0d0d0d; }

  /* ── Chat column ── */
  .chat { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
  .brand {
    padding: 16px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .brand .logo {
    width: 28px; height: 28px; background: var(--lime);
    display: grid; place-items: center; color: #0d0d0d; font-weight: 800; font-size: 15px;
  }
  .brand h1 { font-size: 15px; margin: 0; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; }
  .brand .status {
    margin-left: auto; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
    display: flex; align-items: center; gap: 7px; font-family: var(--mono);
  }
  .dot { width: 8px; height: 8px; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }

  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 84%; padding: 11px 14px; white-space: pre-wrap; word-wrap: break-word; border-radius: 0; }
  .msg.user { align-self: flex-end; background: var(--coral); color: #0d0d0d; font-weight: 500; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-left: 2px solid var(--lime); }
  .msg a { color: var(--lime); text-underline-offset: 2px; }
  .msg.user a { color: #0d0d0d; }
  /* Rendered markdown inside assistant messages */
  .msg.assistant { white-space: normal; }
  .msg.assistant p { margin: 6px 0; white-space: pre-wrap; }
  .msg.assistant p:first-child { margin-top: 0; } .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant strong { color: #fff; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { margin: 12px 0 6px; line-height: 1.25; }
  .msg.assistant h1 { font-size: 18px; } .msg.assistant h2 { font-size: 16px; }
  .msg.assistant h3 { font-size: 14px; } .msg.assistant h4 { font-size: 13px; color: var(--muted); }
  .msg.assistant ul, .msg.assistant ol { margin: 6px 0; padding-left: 20px; }
  .msg.assistant li { margin: 2px 0; }
  .msg.assistant code { background: var(--panel2); border: 1px solid var(--border); padding: 1px 5px; font-family: var(--mono); font-size: 12px; }
  .msg.assistant pre { background: var(--panel2); border: 1px solid var(--border); padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .msg.assistant pre code { border: none; padding: 0; background: none; }
  .msg.assistant blockquote { border-left: 2px solid var(--olive); margin: 8px 0; padding-left: 10px; color: var(--muted); }
  .msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .msg.assistant table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; }
  .msg.assistant th, .msg.assistant td { border: 1px solid var(--border-hi); padding: 5px 9px; text-align: left; }
  .msg.assistant th { background: var(--panel2); color: var(--lime); font-weight: 600; white-space: nowrap; }
  .tool {
    align-self: flex-start; font-size: 11px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--border); padding: 4px 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .5px;
  }
  .tool b { color: var(--lime); }

  .composer { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .composer textarea {
    flex: 1; resize: none; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 0; padding: 11px 12px; font: inherit; max-height: 120px; outline: none;
  }
  .composer textarea:focus { border-color: var(--lime); }
  .composer button {
    border: none; border-radius: 0; padding: 0 18px; font-weight: 700; cursor: pointer;
    background: var(--lime); color: #0d0d0d; text-transform: uppercase; letter-spacing: 1px; font-size: 12px;
  }
  .composer button:disabled { opacity: .45; cursor: default; }
  .composer button.busy { color: transparent; position: relative; opacity: 1; }
  .composer button.busy::after {
    content: "•••"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #0d0d0d; letter-spacing: 3px; font-size: 16px; animation: blink 1.1s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .msg.typing { display: flex; gap: 5px; align-items: center; padding: 13px 14px; }
  .msg.typing .td { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
  .msg.typing .td:nth-child(2) { animation-delay: .15s; }
  .msg.typing .td:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  .composer .mic { background: transparent; color: var(--muted); border: 1px solid var(--border); cursor: pointer; padding: 0 12px; font-family: var(--mono); font-size: 12px; }
  .composer .mic:hover { color: var(--text); border-color: var(--border-hi); }
  .composer .mic.rec { color: #0d0d0d; background: var(--coral); border-color: var(--coral); animation: pulse 1s infinite; }
  .composer .mic.busy { opacity: .6; cursor: default; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ── Sidebar ── */
  .side { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: var(--bg); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 0; overflow: hidden; min-height: fit-content; }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
    margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; font-family: var(--mono);
  }
  .card h2::before { content: ""; width: 7px; height: 7px; background: var(--lime); display: inline-block; }
  .card .body { padding: 12px 14px; }
  .cal-item { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .cal-item:last-child { border-bottom: none; }
  a.cal-item { text-decoration: none; color: inherit; cursor: pointer; margin: 0 -14px; padding: 7px 14px; transition: background .12s; }
  a.cal-item:hover { background: rgba(188, 191, 86, .10); }
  .cal-item .t { color: var(--lime); font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 92px; font-size: 12px; line-height: 1.35; }
  .empty { color: var(--muted); font-style: italic; }
  .caps { display: flex; flex-direction: column; gap: 10px; }
  .cap-cat { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; }
  .caps-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .cap {
    font-size: 11px; background: var(--panel2); border: 1px solid var(--border-hi); border-radius: 0;
    padding: 4px 10px; color: var(--text); font-family: var(--mono); text-transform: lowercase; cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .cap:hover { color: var(--lime); border-color: var(--lime); }
  #graph { height: 260px; background: var(--panel2); border-top: 1px solid var(--border); }
  .hint { font-size: 10px; color: var(--muted); padding: 8px 14px 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; }
  /* card header controls (search / center) */
  .h2ctl { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .h2ctl span { cursor: pointer; display: inline-flex; align-items: center; } .h2ctl span:hover { color: var(--lime); }
  .h2ctl svg { width: 14px; height: 14px; display: block; }
  /* brain search panel */
  .brain-search { display: none; padding: 10px 14px; border-top: 1px solid var(--border); }
  .brain-search.open { display: block; }
  .brain-search input { width: 100%; box-sizing: border-box; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; font: inherit; outline: none; }
  .brain-search input:focus { border-color: var(--lime); }
  #brainResults { margin-top: 8px; max-height: 220px; overflow-y: auto; }
  .bnote { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); text-decoration: none; }
  .bnote:hover { background: rgba(188,191,86,.08); color: var(--lime); }
  .bnote .bf { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
  .brain-more { margin-top: 8px; width: 100%; background: var(--panel2); border: 1px solid var(--border-hi); color: var(--text); padding: 6px; cursor: pointer; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .brain-more:hover { border-color: var(--lime); color: var(--lime); }
  /* files widget */
  .files-crumb { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 8px; word-break: break-all; }
  .files-crumb .crumb { cursor: pointer; } .files-crumb .crumb:hover { color: var(--lime); }
  .files-drop { border: 1px dashed transparent; transition: border-color .15s, background .15s; min-height: 40px; }
  .files-drop.dragover { border-color: var(--lime); background: rgba(188,191,86,.06); }
  .file-row { display: flex; align-items: center; gap: 9px; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .file-row:last-child { border-bottom: none; }
  .file-row .fi { color: var(--muted); flex: none; display: inline-flex; }
  .file-row .fi svg { width: 15px; height: 15px; display: block; }
  .file-row .fn { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
  .file-row[data-dir="1"] .fn, .file-row[data-dir="1"] .fi { cursor: pointer; }
  .file-row[data-dir="1"] .fn:hover { color: var(--lime); }
  .file-row .fs { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
  .file-acts { display: flex; gap: 8px; flex: none; }
  .file-act { color: var(--muted); cursor: pointer; display: inline-flex; text-decoration: none; }
  .file-act:hover { color: var(--lime); }
  .file-act svg { width: 14px; height: 14px; display: block; }
  .files-newinput { width: 100%; box-sizing: border-box; background: var(--panel2); border: 1px solid var(--lime); color: var(--text); padding: 8px 10px; font: inherit; outline: none; margin-bottom: 8px; }
  /* toast */
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--panel); border: 1px solid var(--lime); color: var(--text); padding: 10px 16px;
    font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 90; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* language toggle */
  #langToggle { margin-left: 10px; background: var(--panel2); color: var(--muted); border: 1px solid var(--border); font-family: var(--mono); font-size: 10px; padding: 3px 8px; cursor: pointer; letter-spacing: 1px; }
  #langToggle:hover { border-color: var(--border-hi); color: var(--text); }
  @media (max-width: 859px) { #langToggle { display: none; } }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #262626; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── Panel toggle (drawer) ── */
  #panelToggle {
    display: none; margin-left: 12px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 0; padding: 5px 10px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  #panelToggle:hover { color: var(--text); border-color: var(--border-hi); }
  #newChat {
    margin-left: 12px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 0; padding: 5px 10px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  #newChat:hover { color: var(--lime); border-color: var(--border-hi); }
  #convosToggle {
    margin-left: 14px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 0; padding: 4px 9px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  #convosToggle:hover { color: var(--text); border-color: var(--border-hi); }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
  #overlay.show { display: block; }
  .convo-edit { flex: 1; background: var(--panel); border: 1px solid var(--lime); color: var(--text); font: inherit; font-size: 13px; padding: 2px 6px; border-radius: 0; outline: none; }

  /* ── Conversations drawer (left) ── */
  .convos {
    position: fixed; top: 0; left: 0; height: 100dvh; width: min(320px, 86vw);
    background: var(--panel2); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform .25s ease; z-index: 55;
    display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,.55);
  }
  .convos.open { transform: translateX(0); }
  .convos-head { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--border); }
  .convos-head h2 { margin: 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); }
  #convosNew { margin-left: auto; background: var(--lime); color: #0d0d0d; border: none; border-radius: 0; padding: 5px 10px; font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase; }
  #convosSearch { margin: 10px 14px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 0; color: var(--text); font: inherit; outline: none; }
  #convosSearch:focus { border-color: var(--lime); }
  #convosList { overflow-y: auto; flex: 1; }
  .convo-day { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 10px 14px 4px; }
  .convo { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .convo:hover { background: rgba(188,191,86,.08); }
  .convo.active { border-left: 2px solid var(--lime); }
  .convo-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .convo-time { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .convo-rename { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; }
  .convo-rename:hover { color: var(--lime); }

  /* ── Mobile / narrow: chat full width, right panel becomes a slide-in drawer ── */
  @media (max-width: 859px) {
    body { grid-template-columns: 1fr; }
    .chat { border-right: none; }
    #panelToggle { display: inline-flex; align-items: center; margin-left: auto; }
    .brand .status { display: none; }
    .side {
      position: fixed; top: 0; right: 0; height: 100dvh; width: min(340px, 86vw);
      transform: translateX(100%); transition: transform .25s ease; z-index: 50;
      border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,.55);
    }
    .side.open { transform: translateX(0); }
    .messages { padding: 14px; }
    .msg { max-width: 92%; }
    #graph { height: 200px; }
    .composer { gap: 6px; padding: 10px; }
    .composer button { padding: 0 12px; }
    .composer textarea { padding: 10px; }
  }

  /* ── Model indicator ── */
  .modelpick { position: relative; margin-left: 10px; }
  .modelbtn {
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    font-family: var(--mono); font-size: 10px; padding: 3px 8px; cursor: pointer; letter-spacing: .3px;
    text-transform: lowercase; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .modelbtn:hover { border-color: var(--border-hi); }
  .modelbtn b { color: var(--lime); font-weight: 600; }
  .modelmenu {
    display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 60;
    background: var(--panel); border: 1px solid var(--border-hi); min-width: 210px; max-height: 60vh;
    overflow-y: auto; box-shadow: 0 12px 30px rgba(0,0,0,.55);
  }
  .modelmenu.open { display: block; }
  .mm-group { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 8px 10px 3px; border-top: 1px solid var(--border); }
  .mm-group:first-child { border-top: none; }
  .mm-item { padding: 6px 12px; font-family: var(--mono); font-size: 11px; cursor: pointer; white-space: nowrap; }
  .mm-item:hover { background: rgba(188,191,86,.10); }
  .mm-item.sel { color: var(--lime); }
  .mm-item.disabled { color: var(--muted); opacity: .5; cursor: default; }
  .mm-item.disabled:hover { background: none; }
  @media (max-width: 859px) { .modelpick { display: none; } }

  /* ── Homelab / status widget ── */
  .svc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .svc { display: flex; align-items: center; gap: 7px; font-size: 12px; font-family: var(--mono); }
  .svc .d { width: 8px; height: 8px; flex: none; background: var(--muted); }
  .svc .d.up { background: var(--ok); } .svc .d.down { background: var(--err); }
  .svc .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .svc .ms { margin-left: auto; color: var(--muted); font-size: 10px; }
  .metric { margin-top: 10px; }
  .metric .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .bar { height: 6px; background: var(--panel2); border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; background: var(--lime); }
  .bar > i.warn { background: var(--coral); }
  .metric .rows { display: flex; flex-direction: column; gap: 5px; }
  .metric .row { display: grid; grid-template-columns: 64px 1fr 42px; align-items: center; gap: 8px; font-size: 11px; font-family: var(--mono); }
  .metric .row .rv { text-align: right; color: var(--muted); }
  /* homelab: section labels + per-node resource bars (compact) */
  .hl-lbl { font-size: 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  .hl-div { border-top: 1px solid var(--border); margin: 12px 0 10px; }
  .hl-node { margin-bottom: 9px; }
  .hl-name { font-size: 11px; font-family: var(--mono); color: var(--text); margin-bottom: 4px; }
  .hl-bars { display: flex; flex-direction: column; gap: 3px; }
  .hl-b { display: grid; grid-template-columns: 38px 1fr 40px; align-items: center; gap: 8px; font-size: 10px; font-family: var(--mono); }
  .hl-b .k { color: var(--muted); }
  .hl-b .v { text-align: right; color: var(--muted); }
  /* homelab two-column: services left, resources (scrollable) right */
  .hl-cols { display: flex; gap: 14px; align-items: flex-start; }
  .hl-col-svc { flex: 0 0 42%; min-width: 0; }
  .hl-col-svc .svc { padding: 3px 0; }
  .hl-col-res { flex: 1; min-width: 0; min-height: 120px; max-height: 300px; overflow-y: auto; padding-right: 10px; }
  @media (max-width: 859px) { .hl-cols { flex-direction: column; } .hl-col-res { max-height: none; } }

  /* ── Tasks (Linear) widget ── */
  .task { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .task:last-child { border-bottom: none; }
  .task .chk { width: 16px; height: 16px; flex: none; border: 1px solid var(--border-hi); background: var(--panel2); cursor: pointer; margin-top: 2px; }
  .task .chk:hover { border-color: var(--lime); }
  .task .tt { flex: 1; font-size: 13px; }
  .task .tt a { color: inherit; text-decoration: none; }
  .task .tt a:hover { color: var(--lime); }
  .task .st { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; }
  .task.p1 .tt { border-left: 2px solid var(--coral); padding-left: 6px; }
  #tasks { max-height: 320px; overflow-y: auto; }
  .proj { margin-bottom: 6px; }

function t(k) { return (I18N[lang] && I18N[lang][k] !== undefined) ? I18N[lang][k] : (I18N.es[k] !== undefined ? I18N.es[k] : k); }
function applyLang(l) {
  lang = l; localStorage.setItem("rebeca_lang", l);
  document.documentElement.lang = l;
  $("langToggle").textContent = l.toUpperCase();
  document.querySelectorAll("[data-i18n]").forEach((el) => { const v = I18N[l][el.getAttribute("data-i18n")]; if (v !== undefined) el.textContent = v; });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { const v = I18N[l][el.getAttribute("data-i18n-ph")]; if (v !== undefined) el.setAttribute("placeholder", v); });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => { const v = I18N[l][el.getAttribute("data-i18n-title")]; if (v !== undefined) el.setAttribute("title", v); });
  try { loadHealth(); loadCalendar(); loadTasks(); loadHomelab(); loadFiles(filesPath); } catch (e) {}
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
// Render assistant markdown (tables, bold, headers, code…) safely; fall back to
// plain linkified text if the libraries didn't load.
function renderMd(text) {
  try {
    if (window.marked && window.DOMPurify) {
      return DOMPurify.sanitize(marked.parse(String(text || ""), { gfm: true, breaks: true }));
    }
  } catch (e) {}
  return linkify(text);
}
function fixLinks(el) { el.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; }); }

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (role === "assistant") { el.innerHTML = renderMd(text); fixLinks(el); }
  else el.innerHTML = linkify(text);
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}
function addTool(name, label) {
  const el = document.createElement("div");
  el.className = "tool";
  el.innerHTML = label + " <b>" + esc(name) + "</b>";
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
}

async function send(opts) {
  const speak = !!(opts && opts.speak);
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  stopSpeaking(); // sending something new cuts any playback
  input.value = ""; input.style.height = "auto";
  $("send").disabled = true;
  $("send").classList.add("busy");
  addMsg("user", text);
  // "typing" indicator until the first token/tool event arrives
  const typing = addTyping();
  let typingGone = false;
  const clearTyping = () => { if (!typingGone) { typingGone = true; typing.remove(); } };
  let asstEl = null;
  let buffer = "";
  let finalText = "";

  try {
    const res = await fetch(API + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text, channel: "dashboard", model: selectedModel !== "auto" ? selectedModel : undefined }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let event = null;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) {
          const data = JSON.parse(line.slice(5).trim());
          clearTyping(); // first real event → stop showing the typing dots
          if (event === "tool_call") addTool(data.name, "→ llamando");
          else if (event === "tool_result") addTool(data.name, "✓ resultado de");
          else if (event === "route") lastRoute = data.category;
          else if (event === "model") onModelUsed(data);
          else if (event === "text") { if (data.text) { finalText = data.text; if (!asstEl) asstEl = addMsg("assistant", ""); asstEl.innerHTML = renderMd(data.text); fixLinks(asstEl); messages.scrollTop = messages.scrollHeight; } }
          else if (event === "error") addMsg("assistant", "⚠ " + (data.message || "error"));
        }
      }
    }
    if (speak && finalText) speakText(finalText);
  } catch (err) {
    addMsg("assistant", "⚠ No pude conectar: " + err.message);
  } finally {
    clearTyping();
    $("send").disabled = false;
    $("send").classList.remove("busy");
    $("input").focus();
    loadCalendar();
    loadTasks();
  }
}
function addTyping() {
  const el = document.createElement("div");
  el.className = "msg assistant typing";
  el.innerHTML = '<span class="td"></span><span class="td"></span><span class="td"></span>';
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

$("send").onclick = () => send();

// ── Voice: push-to-talk (record → transcribe → send → speak reply) ──
let mediaRecorder = null, chunks = [], recording = false;

async function toggleMic() {
  const mic = $("mic");
  if (recording) { // stop
    recording = false;
    mic.classList.remove("rec");
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    return;
  }
  // start
  ensureAudio();  // unlock audio playback within this user gesture
  stopSpeaking(); // starting a new recording cuts any playback
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { addMsg("assistant", "⚠ No pude acceder al micrófono: " + e.message); return; }
  chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
    mic.classList.add("busy"); mic.textContent = "…";
    try {
      const r = await fetch(API + "/voice/transcribe", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      const j = await r.json();
      if (j.ok && j.text) { $("input").value = j.text; send({ speak: true }); }
      else addMsg("assistant", "⚠ No entendí el audio.");
    } catch (e) { addMsg("assistant", "⚠ Error de transcripción: " + e.message); }
    finally { mic.classList.remove("busy"); mic.textContent = "MIC"; }
  };
  mediaRecorder.start();
  recording = true;
  mic.classList.add("rec"); mic.textContent = "● REC";
}

// Web Audio API (works around autoplay blocking of delayed audio.play()).
let audioCtx = null, currentSource = null;
function ensureAudio() {
  // Must be called from a user gesture (e.g. the MIC click) to unlock playback.
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function stopSpeaking() {
  if (currentSource) { try { currentSource.stop(); } catch (e) {} currentSource = null; }
  $("stopVoice").style.display = "none";
}
async function speakText(text) {
  stopSpeaking(); // no overlap
  try {
    const r = await fetch(API + "/voice/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!r.ok) return;
    const arr = await r.arrayBuffer();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    const buf = await audioCtx.decodeAudioData(arr);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.onended = () => { if (currentSource === src) { currentSource = null; $("stopVoice").style.display = "none"; } };
    currentSource = src;
    $("stopVoice").style.display = "";
    src.start(0);
  } catch (e) { $("stopVoice").style.display = "none"; }
}

const tzC = "America/Puerto_Rico";
let allSessions = [];
function fmtDay(iso) {
  if (!iso) return "Sin fecha";
  const today = new Date().toLocaleDateString("en-CA", { timeZone: tzC });
  const yest = new Date(Date.now() - 86400000).toLocaleDateString("en-CA", { timeZone: tzC });
  const dd = new Date(iso).toLocaleDateString("en-CA", { timeZone: tzC });
  if (dd === today) return "Hoy";
  if (dd === yest) return "Ayer";
  try { return new Date(iso).toLocaleDateString("es-PR", { timeZone: tzC, day: "numeric", month: "short", year: "numeric" }); } catch { return dd; }
}
function fmtTimeC(iso) { try { return new Date(iso).toLocaleTimeString("es-PR", { timeZone: tzC, hour: "2-digit", minute: "2-digit" }); } catch { return ""; } }
async function loadSessions() {
  try { const r = await (await fetch(API + "/chat/sessions?channel=dashboard")).json(); allSessions = r.sessions || []; }
  catch { allSessions = []; }
  renderSessions();
}
function renderSessions() {
  const q = ($("convosSearch").value || "").toLowerCase();
  const items = allSessions.filter((s) => {
    if (!q) return true;
    const full = s.updated_at ? new Date(s.updated_at).toLocaleDateString("es-PR", { timeZone: tzC, day: "numeric", month: "long", year: "numeric" }) : "";
    return ((s.title || "") + " " + fmtDay(s.updated_at) + " " + full).toLowerCase().includes(q);
  });
  const list = $("convosList");
  if (!items.length) { list.innerHTML = '<div class="empty" style="padding:12px 14px">Sin conversaciones.</div>'; return; }
  let html = "", lastDay = null;
  for (const s of items) {
    const day = fmtDay(s.updated_at);
    if (day !== lastDay) { html += '<div class="convo-day">' + esc(day) + '</div>'; lastDay = day; }
    const active = s.id === sessionId ? " active" : "";
    html += '<div class="convo' + active + '" data-id="' + esc(s.id) + '">' +
      '<span class="convo-title">' + esc(s.title || "Conversación") + '</span>' +
      '<span class="convo-time">' + esc(fmtTimeC(s.updated_at)) + '</span>' +
      '<button class="convo-rename" data-id="' + esc(s.id) + '" title="Renombrar">✎</button></div>';
  }
  list.innerHTML = html;
  list.querySelectorAll(".convo").forEach((el) => el.onclick = (e) => { if (e.target.classList.contains("convo-rename")) return; switchSession(el.dataset.id); });
  list.querySelectorAll(".convo-rename").forEach((el) => el.onclick = (e) => {
    e.stopPropagation();
    startRename(el.closest(".convo"), el.dataset.id);
  });
}
function startRename(convo, id) {
  if (!convo) return;
  const titleSpan = convo.querySelector(".convo-title");
  if (!titleSpan) return;
  const current = titleSpan.textContent;
  const input = document.createElement("input");
  input.className = "convo-edit";
  input.value = current;
  titleSpan.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = async (commit) => {
    if (done) return; done = true;
    const name = (input.value || "").trim();
    if (commit && name && name !== current) {
      try {
        await fetch(API + "/chat/session/rename", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: id, title: name }) });
      } catch (e) {}
    }
    loadSessions();
  };
  input.onkeydown = (ev) => { if (ev.key === "Enter") { ev.preventDefault(); finish(true); } else if (ev.key === "Escape") { finish(false); } };
  input.onblur = () => finish(true);
  input.onclick = (ev) => ev.stopPropagation();
}
async function switchSession(id) {
  sessionId = id;
  localStorage.setItem("rebeca_sid", id.replace(/^dashboard:/, ""));

  $("tmBody").innerHTML = html;
  $("tmBody").querySelectorAll(".tm-task").forEach((el) => {
    const id = el.dataset.id, editor = el.querySelector(".tm-editor");
    el.querySelector('[data-act="toggle"]').onclick = async (e) => {
      e.stopPropagation();
      await invokeTool("complete_task", { id, state: "Done" });
      renderTaskManager(); loadTasks();
    };
    el.querySelector('[data-act="edit"]').onclick = () => {
      const open = editor.style.display !== "none";
      $("tmBody").querySelectorAll(".tm-editor").forEach((x) => x.style.display = "none");
      if (open) return;
      editor.innerHTML = tmEditorHtml(tmTasks[id]);
      editor.style.display = "grid";
      editor.querySelector('[data-act="save"]').onclick = async () => {
        const title = editor.querySelector('[data-f="title"]').value.trim();
        const priority = parseInt(editor.querySelector('[data-f="priority"]').value, 10);
        const state = editor.querySelector('[data-f="state"]').value;
        const msg = editor.querySelector(".tm-msg"); msg.textContent = t("saving");
        try {
          await invokeTool("update_task", { id, title, priority });
          if (state && state.toLowerCase() !== String(tmTasks[id].state || "").toLowerCase()) await invokeTool("complete_task", { id, state });
          msg.textContent = t("saved");
          setTimeout(() => { renderTaskManager(); loadTasks(); }, 500);
        } catch { msg.textContent = t("err"); }
      };
    };
  });
}
$("tasksExpand").onclick = () => { $("taskModalWrap").classList.add("show"); renderTaskManager(); };
$("tmClose").onclick = () => $("taskModalWrap").classList.remove("show");
$("tmReload").onclick = renderTaskManager;
$("taskModalWrap").onclick = (e) => { if (e.target.id === "taskModalWrap") $("taskModalWrap").classList.remove("show"); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("taskModalWrap").classList.remove("show"); });

// ── Files (Nextcloud) widget ──
let filesPath = "";
const SVG = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + "</svg>";
const F_FOLDER = SVG('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>');
const F_FILE = SVG('<path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>');
const F_DL = SVG('<path d="M12 3v12"/><path d="M7 12l5 5 5-5"/><path d="M5 21h14"/>');
const F_SHARE = SVG('<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 1 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 1 0 7 7l1-1"/>');
const F_DEL = SVG('<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/>');
function humanSize(n) { if (!n) return ""; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (Math.round(n * 10) / 10) + " " + u[i]; }
function renderCrumb() {
  const parts = filesPath ? filesPath.split("/") : [];
  let acc = "", html = '<span class="crumb" data-p="">' + t("files_root") + "</span>";
  for (const p of parts) { acc = acc ? acc + "/" + p : p; html += ' / <span class="crumb" data-p="' + esc(acc) + '">' + esc(p) + "</span>"; }
  $("filesCrumb").innerHTML = html;
  $("filesCrumb").querySelectorAll(".crumb").forEach((el) => el.onclick = () => loadFiles(el.dataset.p));
}
function fileRow(it) {
  const dl = it.isDir ? "" : '<a class="file-act" href="' + API + "/files/download?path=" + encodeURIComponent(it.path) + '" title="' + t("t_download") + '">' + F_DL + "</a>";
  return '<div class="file-row" data-path="' + esc(it.path) + '" data-dir="' + (it.isDir ? 1 : 0) + '">' +
    '<span class="fi">' + (it.isDir ? F_FOLDER : F_FILE) + "</span>" +
    '<span class="fn">' + esc(it.name) + "</span>" +
    '<span class="fs">' + (it.isDir ? "" : humanSize(it.size)) + "</span>" +
    '<span class="file-acts">' + dl +
      '<span class="file-act" data-act="share" title="' + t("t_share") + '">' + F_SHARE + "</span>" +
      '<span class="file-act" data-act="del" title="' + t("t_delete") + '">' + F_DEL + "</span>" +
    "</span></div>";
}
async function loadFiles(path) {
  filesPath = path || "";
  renderCrumb();
  $("files").innerHTML = '<span class="empty">' + t("loading") + "</span>";
  try {
    const r = await (await fetch(API + "/files/list?path=" + encodeURIComponent(filesPath))).json();
    if (r.ok === false) throw new Error(r.error || "error");
    const items = r.items || [];
    if (!items.length) { $("files").innerHTML = '<span class="empty">' + t("files_empty") + "</span>"; return; }
    $("files").innerHTML = items.map(fileRow).join("");
    $("files").querySelectorAll(".file-row").forEach((row) => {
      const path = row.dataset.path, isDir = row.dataset.dir === "1";
      const nav = () => { if (isDir) loadFiles(path); };
      row.querySelector(".fn").onclick = nav; row.querySelector(".fi").onclick = nav;
      const share = row.querySelector('[data-act="share"]');
      share.onclick = async (e) => {
        e.stopPropagation();
        const j = await (await fetch(API + "/files/share", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path }) })).json();
        if (j.ok && j.url) copyToClipboard(j.url); else showToast("⚠ " + (j.error || "share failed"));
      };
      const del = row.querySelector('[data-act="del"]');
      del.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm(t("files_del_confirm") + " " + path + "?")) return;
        await fetch(API + "/files/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path }) });
        loadFiles(filesPath);
      };
    });
  } catch { $("files").innerHTML = '<span class="empty">' + t("files_unavailable") + "</span>"; }
}
function uploadFiles(fileList) {
  const files = [...fileList];
  Promise.all(files.map((f) =>
    fetch(API + "/files/upload?path=" + encodeURIComponent(filesPath) + "&name=" + encodeURIComponent(f.name),
      { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: f })
  )).then(() => loadFiles(filesPath)).catch(() => loadFiles(filesPath));
}
$("filesUp").onclick = () => $("filesInput").click();
$("filesInput").onchange = (e) => { if (e.target.files.length) uploadFiles(e.target.files); e.target.value = ""; };
$("filesNewFolder").onclick = () => {
  const inp = $("filesNewInput");
  const open = inp.style.display === "none";
  inp.style.display = open ? "" : "none";
  if (open) { inp.value = ""; inp.focus(); }
};
$("filesNewInput").onkeydown = async (e) => {
  if (e.key === "Escape") { $("filesNewInput").style.display = "none"; return; }
  if (e.key !== "Enter") return;
  const name = $("filesNewInput").value.trim(); if (!name) return;
  $("filesNewInput").style.display = "none";
  const path = (filesPath ? filesPath + "/" : "") + name;
  await fetch(API + "/files/mkdir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path }) });
  loadFiles(filesPath);
};
$("filesReload").onclick = () => loadFiles(filesPath);
// Toast + clipboard (used by share)
let toastTimer = null;
function showToast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}
async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); showToast(t("files_link_copied")); }
  catch { showToast(t("files_link_fail") + " " + text); }
}
(() => {
  const drop = $("filesDrop");
  ["dragover", "dragenter"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("dragover"); }));
  drop.addEventListener("drop", (e) => { if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });
})();

// ── Command palette (Ctrl-K / Cmd-K): fire any tool without typing a prompt ──
let palTools = [], palFiltered = [], palSel = 0, palMode = null;
async function ensurePalTools() { if (palTools.length) return; try { palTools = (await (await fetch(API + "/tools")).json()).tools || []; } catch {} }
function openPalette() { ensurePalTools().then(() => { palMode = null; $("paletteInput").value = ""; renderPalette(""); $("paletteWrap").classList.add("show"); $("paletteInput").focus(); }); }
function closePalette() { $("paletteWrap").classList.remove("show"); palMode = null; }
function renderPalette(q) {
  q = (q || "").toLowerCase();
  palFiltered = palTools.filter((t) => (t.name + " " + (t.description || "")).toLowerCase().includes(q));
  palSel = 0;
  $("paletteList").innerHTML = palFiltered.map((t, i) =>
    '<div class="pal-item' + (i === 0 ? " sel" : "") + '" data-i="' + i + '"><div class="pn">' + esc(t.name) + '</div><div class="pd">' + esc(t.description || "") + "</div></div>"
  ).join("") || '<div class="pal-item"><div class="pd">' + t("pal_none") + '</div></div>';
  $("paletteList").querySelectorAll(".pal-item[data-i]").forEach((el) => el.onclick = () => chooseTool(palFiltered[+el.dataset.i]));
}
function chooseTool(t) {
  if (!t) return;
  const props = (t.input_schema && t.input_schema.properties) || {};
  const required = (t.input_schema && t.input_schema.required) || [];
  const keys = Object.keys(props);
  if (!keys.length) { runPaletteTool(t, {}); return; }
  palMode = { tool: t };
  $("paletteList").innerHTML = keys.map((k) =>
    '<div class="pal-field"><label>' + esc(k) + (required.includes(k) ? " *" : "") + '</label>' +
    '<input data-k="' + esc(k) + '" placeholder="' + esc((props[k].description || "").slice(0, 60)) + '"/></div>'
  ).join("") + '<div class="pal-item sel" id="palRun"><div class="pn">▶ Ejecutar ' + esc(t.name) + "</div></div>";
  const first = $("paletteList").querySelector("input"); if (first) first.focus();
  $("palRun").onclick = () => submitPaletteForm(t, required);
  $("paletteList").querySelectorAll(".pal-field input").forEach((inp) => inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); submitPaletteForm(t, required); } });
}
function submitPaletteForm(t, required) {
  const input = {};
  $("paletteList").querySelectorAll(".pal-field input").forEach((inp) => { const v = inp.value.trim(); if (v) input[inp.dataset.k] = v; });
  for (const req of required) {
    if (!input[req]) { const el = $("paletteList").querySelector('input[data-k="' + req + '"]'); if (el) { el.style.borderColor = "var(--coral)"; el.focus(); } return; }
  }
  runPaletteTool(t, input);
}
async function runPaletteTool(t, input) {
  closePalette();
  addTool(t.name, "→ ejecutando");
  try {
    const res = await invokeTool(t.name, input);
    const summary = (res && (res.result || res.answer)) ? (res.result || res.answer) : JSON.stringify(res);
    addMsg("assistant", "✓ " + t.name + ": " + String(summary).slice(0, 600));
  } catch (e) { addMsg("assistant", "⚠ " + t.name + " falló: " + e.message); }
  loadCalendar(); loadTasks(); loadHomelab();
}
function updateSel(items) { items.forEach((el, i) => el.classList.toggle("sel", i === palSel)); if (items[palSel]) items[palSel].scrollIntoView({ block: "nearest" }); }
$("paletteInput").oninput = (e) => { if (!palMode) renderPalette(e.target.value); };
$("paletteInput").onkeydown = (e) => {
  if (e.key === "Escape") { closePalette(); return; }
  if (palMode) return;
  const items = $("paletteList").querySelectorAll(".pal-item[data-i]");
  if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palSel + 1, items.length - 1); updateSel(items); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(palSel - 1, 0); updateSel(items); }
  else if (e.key === "Enter") { e.preventDefault(); chooseTool(palFiltered[palSel]); }
};
$("paletteWrap").onclick = (e) => { if (e.target.id === "paletteWrap") closePalette(); };
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
    e.preventDefault();
    $("paletteWrap").classList.contains("show") ? closePalette() : openPalette();
  }
});

$("langToggle").onclick = () => applyLang(lang === "es" ? "en" : "es");
loadHistory().then((had) => { if (!had) addMsg("assistant", t("greeting")); });
applyLang(lang);   // sets language on static + dynamic UI (also loads health/calendar/tasks/homelab)
loadCaps(); loadGraph(); loadModels(); loadFiles("");
setInterval(loadHealth, 30000);
setInterval(loadCalendar, 300000); // keep upcoming events fresh (every 5 min)
setInterval(loadHomelab, 30000);   // refresh homelab status
setInterval(loadModels, 60000);    // refresh model availability
</script>
