<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REBECA</title>
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.43.5/dist/force-graph.min.js"></script>
<style>
  :root {
    --bg: #0d0d0d; --panel: #151515; --panel2: #0f0f0f;
    --border: #2c2c2c; --border-hi: #3d3d3d; --line: #d8d8d8;
    --text: #ededed; --muted: #8a8a80;
    --lime: #bcbf56; --coral: #f27e63; --terra: #bf6550; --olive: #71734c;
    --ok: #bcbf56; --err: #f27e63;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: 100dvh;
  }
  ::selection { background: var(--lime); color: #0d0d0d; }

  /* ── Chat column ── */
  .chat { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
  .brand {
    padding: 16px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .brand .logo {
    width: 28px; height: 28px; background: var(--lime);
    display: grid; place-items: center; color: #0d0d0d; font-weight: 800; font-size: 15px;
  }
  .brand h1 { font-size: 15px; margin: 0; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; }
  .brand .status {
    margin-left: auto; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
    display: flex; align-items: center; gap: 7px; font-family: var(--mono);
  }
  .dot { width: 8px; height: 8px; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }

  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 84%; padding: 11px 14px; white-space: pre-wrap; word-wrap: break-word; border-radius: 0; }
  .msg.user { align-self: flex-end; background: var(--coral); color: #0d0d0d; font-weight: 500; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-left: 2px solid var(--lime); }
  .msg a { color: var(--lime); text-underline-offset: 2px; }
  .msg.user a { color: #0d0d0d; }
  .tool {
    align-self: flex-start; font-size: 11px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--border); padding: 4px 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .5px;
  }
  .tool b { color: var(--lime); }

  .composer { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .composer textarea {
    flex: 1; resize: none; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 0; padding: 11px 12px; font: inherit; max-height: 120px; outline: none;
  }
  .composer textarea:focus { border-color: var(--lime); }
  .composer button {
    border: none; border-radius: 0; padding: 0 18px; font-weight: 700; cursor: pointer;
    background: var(--lime); color: #0d0d0d; text-transform: uppercase; letter-spacing: 1px; font-size: 12px;
  }
  .composer button:disabled { opacity: .45; cursor: default; }
  .composer .mic { background: transparent; color: var(--muted); border: 1px solid var(--border); cursor: pointer; padding: 0 12px; font-family: var(--mono); font-size: 12px; }
  .composer .mic:hover { color: var(--text); border-color: var(--border-hi); }
  .composer .mic.rec { color: #0d0d0d; background: var(--coral); border-color: var(--coral); animation: pulse 1s infinite; }
  .composer .mic.busy { opacity: .6; cursor: default; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ── Sidebar ── */
  .side { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: var(--bg); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 0; overflow: hidden; }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
    margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; font-family: var(--mono);
  }
  .card h2::before { content: ""; width: 7px; height: 7px; background: var(--lime); display: inline-block; }
  .card .body { padding: 12px 14px; }
  .cal-item { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .cal-item:last-child { border-bottom: none; }
  a.cal-item { text-decoration: none; color: inherit; cursor: pointer; margin: 0 -14px; padding: 7px 14px; transition: background .12s; }
  a.cal-item:hover { background: rgba(188, 191, 86, .10); }
  .cal-item .t { color: var(--lime); font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 92px; font-size: 12px; line-height: 1.35; }
  .empty { color: var(--muted); font-style: italic; }
  .caps { display: flex; flex-wrap: wrap; gap: 6px; }
  .cap {
    font-size: 11px; background: var(--panel2); border: 1px solid var(--border-hi); border-radius: 0;
    padding: 4px 10px; color: var(--text); font-family: var(--mono); text-transform: lowercase; cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .cap:hover { color: var(--lime); border-color: var(--lime); }
  #graph { height: 260px; background: var(--panel2); border-top: 1px solid var(--border); }
  .hint { font-size: 10px; color: var(--muted); padding: 8px 14px 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #262626; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── Panel toggle (drawer) ── */
  #panelToggle {
    display: none; margin-left: 12px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 0; padding: 5px 10px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  #panelToggle:hover { color: var(--text); border-color: var(--border-hi); }
  #newChat {
    margin-left: 12px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 0; padding: 5px 10px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  #newChat:hover { color: var(--lime); border-color: var(--border-hi); }
  #convosToggle {
    margin-left: 14px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 0; padding: 4px 9px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  #convosToggle:hover { color: var(--text); border-color: var(--border-hi); }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
  #overlay.show { display: block; }
  .convo-edit { flex: 1; background: var(--panel); border: 1px solid var(--lime); color: var(--text); font: inherit; font-size: 13px; padding: 2px 6px; border-radius: 0; outline: none; }

  /* ── Conversations drawer (left) ── */
  .convos {
    position: fixed; top: 0; left: 0; height: 100dvh; width: min(320px, 86vw);
    background: var(--panel2); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform .25s ease; z-index: 55;
    display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,.55);
  }
  .convos.open { transform: translateX(0); }
  .convos-head { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--border); }
  .convos-head h2 { margin: 0; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); }
  #convosNew { margin-left: auto; background: var(--lime); color: #0d0d0d; border: none; border-radius: 0; padding: 5px 10px; font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase; }
  #convosSearch { margin: 10px 14px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 0; color: var(--text); font: inherit; outline: none; }
  #convosSearch:focus { border-color: var(--lime); }
  #convosList { overflow-y: auto; flex: 1; }
  .convo-day { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 10px 14px 4px; }
  .convo { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .convo:hover { background: rgba(188,191,86,.08); }
  .convo.active { border-left: 2px solid var(--lime); }
  .convo-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .convo-time { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .convo-rename { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; }
  .convo-rename:hover { color: var(--lime); }

  /* ── Mobile / narrow: chat full width, right panel becomes a slide-in drawer ── */
  @media (max-width: 859px) {
    body { grid-template-columns: 1fr; }
    .chat { border-right: none; }
    #panelToggle { display: inline-flex; align-items: center; margin-left: auto; }
    .brand .status { display: none; }
    .side {
      position: fixed; top: 0; right: 0; height: 100dvh; width: min(340px, 86vw);
      transform: translateX(100%); transition: transform .25s ease; z-index: 50;
      border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,.55);
    }
    .side.open { transform: translateX(0); }
    .messages { padding: 14px; }
    .msg { max-width: 92%; }
    #graph { height: 200px; }
    .composer { gap: 6px; padding: 10px; }
    .composer button { padding: 0 12px; }
    .composer textarea { padding: 10px; }
  }

  /* ── Model indicator ── */
  .modelchip {
    margin-left: 10px; font-family: var(--mono); font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); padding: 2px 7px; text-transform: lowercase; letter-spacing: .3px;
    max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modelchip b { color: var(--lime); font-weight: 600; }
  @media (max-width: 859px) { .modelchip { display: none; } }

  /* ── Homelab / status widget ── */
  .svc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .svc { display: flex; align-items: center; gap: 7px; font-size: 12px; font-family: var(--mono); }
  .svc .d { width: 8px; height: 8px; flex: none; background: var(--muted); }
  .svc .d.up { background: var(--ok); } .svc .d.down { background: var(--err); }
  .svc .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .svc .ms { margin-left: auto; color: var(--muted); font-size: 10px; }
  .metric { margin-top: 10px; }
  .metric .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .bar { height: 6px; background: var(--panel2); border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; background: var(--lime); }
  .bar > i.warn { background: var(--coral); }
  .metric .rows { display: flex; flex-direction: column; gap: 5px; }
  .metric .row { display: grid; grid-template-columns: 64px 1fr 42px; align-items: center; gap: 8px; font-size: 11px; font-family: var(--mono); }
  .metric .row .rv { text-align: right; color: var(--muted); }
  /* homelab: section labels + per-node resource bars (compact) */
  .hl-lbl { font-size: 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  .hl-div { border-top: 1px solid var(--border); margin: 12px 0 10px; }
  .hl-node { margin-bottom: 9px; }
  .hl-name { font-size: 11px; font-family: var(--mono); color: var(--text); margin-bottom: 4px; }
  .hl-bars { display: flex; flex-direction: column; gap: 3px; }
  .hl-b { display: grid; grid-template-columns: 38px 1fr 40px; align-items: center; gap: 8px; font-size: 10px; font-family: var(--mono); }
  .hl-b .k { color: var(--muted); }
  .hl-b .v { text-align: right; color: var(--muted); }
  /* homelab two-column: services left, resources (scrollable) right */
  .hl-cols { display: flex; gap: 14px; align-items: flex-start; }
  .hl-col-svc { flex: 0 0 42%; min-width: 0; }
  .hl-col-svc .svc { padding: 3px 0; }
  .hl-col-res { flex: 1; min-width: 0; min-height: 120px; max-height: 300px; overflow-y: auto; }
  @media (max-width: 859px) { .hl-cols { flex-direction: column; } .hl-col-res { max-height: none; } }

  /* ── Tasks (Linear) widget ── */
  .task { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .task:last-child { border-bottom: none; }
  .task .chk { width: 16px; height: 16px; flex: none; border: 1px solid var(--border-hi); background: var(--panel2); cursor: pointer; margin-top: 2px; }
  .task .chk:hover { border-color: var(--lime); }
  .task .tt { flex: 1; font-size: 13px; }
  .task .tt a { color: inherit; text-decoration: none; }
  .task .tt a:hover { color: var(--lime); }
  .task .st { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; }
  .task.p1 .tt { border-left: 2px solid var(--coral); padding-left: 6px; }
  #tasks { max-height: 260px; overflow-y: auto; }

  /* ── Command palette (Ctrl-K) ── */
  #paletteWrap { display: none; position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.55); }
  #paletteWrap.show { display: block; }
  .palette { position: absolute; top: 12vh; left: 50%; transform: translateX(-50%); width: min(560px, 92vw);
    background: var(--panel); border: 1px solid var(--border-hi); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .palette input { width: 100%; box-sizing: border-box; background: var(--panel2); color: var(--text);
    border: none; border-bottom: 1px solid var(--border); padding: 14px 16px; font: inherit; font-size: 15px; outline: none; }
  .pal-list { max-height: 52vh; overflow-y: auto; }
  .pal-item { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .pal-item:hover, .pal-item.sel { background: rgba(188,191,86,.10); }
  .pal-item .pn { font-size: 13px; font-family: var(--mono); color: var(--lime); }
  .pal-item .pd { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pal-hint { padding: 8px 16px; font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid var(--border); }
  .pal-field { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .pal-field label { display: block; font-size: 11px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; margin-bottom: 4px; }
  .pal-field input { border: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>
  <section class="chat">
    <div class="brand">
      <div class="logo">R</div>
      <h1>Rebeca</h1>
      <button id="convosToggle" title="Conversaciones" aria-label="Conversaciones">🗂</button>
      <div class="status"><span class="dot" id="healthDot"></span><span id="healthText">conectando</span></div>
      <span class="modelchip" id="modelChip" title="Modelo usado en la última respuesta"></span>
      <button id="panelToggle" title="Panel" aria-label="Panel">☰</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <button class="mic" id="mic" title="Hablar (clic para grabar, clic para enviar)">MIC</button>
      <textarea id="input" rows="1" placeholder="Escribe a Rebeca…  (Enter para enviar)"></textarea>
      <button id="send">Enviar</button>
      <button class="mic" id="stopVoice" title="Detener voz" style="display:none">■</button>
    </div>
  </section>

  <aside class="side" id="side">
    <div class="card">
      <h2>Próximos eventos</h2>
      <div class="body" id="calendar"><span class="empty">Cargando…</span></div>
    </div>
    <div class="card">
      <h2>Tareas <span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer" id="tasksReload" title="Actualizar">↻</span></h2>
      <div class="body" id="tasks"><span class="empty">Cargando…</span></div>
    </div>
    <div class="card">
      <h2>Homelab</h2>
      <div class="body" id="homelab"><span class="empty">Cargando…</span></div>
    </div>
    <div class="card">
      <h2>Second brain</h2>
      <div id="graph"></div>
      <div class="hint" id="graphHint"></div>
    </div>
    <div class="card">
      <h2>Capacidades</h2>
      <div class="body"><div class="caps" id="caps"><span class="empty">Cargando…</span></div></div>
    </div>
  </aside>

  <aside class="convos" id="convos">
    <div class="convos-head">
      <h2>Conversaciones</h2>
      <button id="convosNew" title="Nueva">＋ Nueva</button>
    </div>
    <input id="convosSearch" placeholder="Buscar…" autocomplete="off" />
    <div id="convosList"></div>
  </aside>

  <div id="overlay"></div>

  <div id="paletteWrap">
    <div class="palette" role="dialog" aria-label="Acciones rápidas">
      <input id="paletteInput" placeholder="Buscar acción…  (Esc para cerrar)" autocomplete="off" />
      <div class="pal-list" id="paletteList"></div>
      <div class="pal-hint">↑↓ navegar · Enter ejecutar · Esc cerrar</div>
    </div>
  </div>

<script>
const API = ""; // same origin as assistant-core
let sessionId = "dashboard:" + (localStorage.getItem("rebeca_sid") || (() => {
  const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("rebeca_sid", id); return id;
})());

const $ = (id) => document.getElementById(id);
const messages = $("messages");

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }

function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = linkify(text);
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}
function addTool(name, label) {
  const el = document.createElement("div");
  el.className = "tool";
  el.innerHTML = label + " <b>" + esc(name) + "</b>";
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
}

async function send(opts) {
  const speak = !!(opts && opts.speak);
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;
  stopSpeaking(); // sending something new cuts any playback
  input.value = ""; input.style.height = "auto";
  $("send").disabled = true;
  addMsg("user", text);
  let asstEl = null;
  let buffer = "";
  let finalText = "";

  try {
    const res = await fetch(API + "/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text, channel: "dashboard" }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let event = null;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) {
          const data = JSON.parse(line.slice(5).trim());
          if (event === "tool_call") addTool(data.name, "→ llamando");
          else if (event === "tool_result") addTool(data.name, "✓ resultado de");
          else if (event === "route") lastRoute = data.category;
          else if (event === "model") setModelChip(data);
          else if (event === "text") { if (data.text) { finalText = data.text; if (!asstEl) asstEl = addMsg("assistant", ""); asstEl.innerHTML = linkify(data.text); messages.scrollTop = messages.scrollHeight; } }
          else if (event === "error") addMsg("assistant", "⚠ " + (data.message || "error"));
        }
      }
    }
    if (speak && finalText) speakText(finalText);
  } catch (err) {
    addMsg("assistant", "⚠ No pude conectar: " + err.message);
  } finally {
    $("send").disabled = false;
    $("input").focus();
    loadCalendar();
  }
}

$("send").onclick = () => send();

// ── Voice: push-to-talk (record → transcribe → send → speak reply) ──
let mediaRecorder = null, chunks = [], recording = false;

async function toggleMic() {
  const mic = $("mic");
  if (recording) { // stop
    recording = false;
    mic.classList.remove("rec");
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    return;
  }
  // start
  ensureAudio();  // unlock audio playback within this user gesture
  stopSpeaking(); // starting a new recording cuts any playback
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { addMsg("assistant", "⚠ No pude acceder al micrófono: " + e.message); return; }
  chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
    mic.classList.add("busy"); mic.textContent = "…";
    try {
      const r = await fetch(API + "/voice/transcribe", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
      const j = await r.json();
      if (j.ok && j.text) { $("input").value = j.text; send({ speak: true }); }
      else addMsg("assistant", "⚠ No entendí el audio.");
    } catch (e) { addMsg("assistant", "⚠ Error de transcripción: " + e.message); }
    finally { mic.classList.remove("busy"); mic.textContent = "MIC"; }
  };
  mediaRecorder.start();
  recording = true;
  mic.classList.add("rec"); mic.textContent = "● REC";
}

// Web Audio API (works around autoplay blocking of delayed audio.play()).
let audioCtx = null, currentSource = null;
function ensureAudio() {
  // Must be called from a user gesture (e.g. the MIC click) to unlock playback.
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function stopSpeaking() {
  if (currentSource) { try { currentSource.stop(); } catch (e) {} currentSource = null; }
  $("stopVoice").style.display = "none";
}
async function speakText(text) {
  stopSpeaking(); // no overlap
  try {
    const r = await fetch(API + "/voice/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!r.ok) return;
    const arr = await r.arrayBuffer();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    const buf = await audioCtx.decodeAudioData(arr);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.onended = () => { if (currentSource === src) { currentSource = null; $("stopVoice").style.display = "none"; } };
    currentSource = src;
    $("stopVoice").style.display = "";
    src.start(0);
  } catch (e) { $("stopVoice").style.display = "none"; }
}

$("mic").onclick = toggleMic;
$("stopVoice").onclick = stopSpeaking;

// Drawers: right panel (widgets) and left panel (conversations).
function closeAllDrawers() {
  $("side").classList.remove("open");
  $("convos").classList.remove("open");
  $("overlay").classList.remove("show");
}
$("panelToggle").onclick = () => {
  const willOpen = !$("side").classList.contains("open");
  $("convos").classList.remove("open");
  $("side").classList.toggle("open", willOpen);
  $("overlay").classList.toggle("show", willOpen);
};
$("overlay").onclick = closeAllDrawers;

// ── Conversations switcher ──
const tzC = "America/Puerto_Rico";
let allSessions = [];
function fmtDay(iso) {
  if (!iso) return "Sin fecha";
  const today = new Date().toLocaleDateString("en-CA", { timeZone: tzC });
  const yest = new Date(Date.now() - 86400000).toLocaleDateString("en-CA", { timeZone: tzC });
  const dd = new Date(iso).toLocaleDateString("en-CA", { timeZone: tzC });
  if (dd === today) return "Hoy";
  if (dd === yest) return "Ayer";
  try { return new Date(iso).toLocaleDateString("es-PR", { timeZone: tzC, day: "numeric", month: "short", year: "numeric" }); } catch { return dd; }
}
function fmtTimeC(iso) { try { return new Date(iso).toLocaleTimeString("es-PR", { timeZone: tzC, hour: "2-digit", minute: "2-digit" }); } catch { return ""; } }
async function loadSessions() {
  try { const r = await (await fetch(API + "/chat/sessions?channel=dashboard")).json(); allSessions = r.sessions || []; }
  catch { allSessions = []; }
  renderSessions();
}
function renderSessions() {
  const q = ($("convosSearch").value || "").toLowerCase();
  const items = allSessions.filter((s) => {
    if (!q) return true;
    const full = s.updated_at ? new Date(s.updated_at).toLocaleDateString("es-PR", { timeZone: tzC, day: "numeric", month: "long", year: "numeric" }) : "";
    return ((s.title || "") + " " + fmtDay(s.updated_at) + " " + full).toLowerCase().includes(q);
  });
  const list = $("convosList");
  if (!items.length) { list.innerHTML = '<div class="empty" style="padding:12px 14px">Sin conversaciones.</div>'; return; }
  let html = "", lastDay = null;
  for (const s of items) {
    const day = fmtDay(s.updated_at);
    if (day !== lastDay) { html += '<div class="convo-day">' + esc(day) + '</div>'; lastDay = day; }
    const active = s.id === sessionId ? " active" : "";
    html += '<div class="convo' + active + '" data-id="' + esc(s.id) + '">' +
      '<span class="convo-title">' + esc(s.title || "Conversación") + '</span>' +
      '<span class="convo-time">' + esc(fmtTimeC(s.updated_at)) + '</span>' +
      '<button class="convo-rename" data-id="' + esc(s.id) + '" title="Renombrar">✎</button></div>';
  }
  list.innerHTML = html;
  list.querySelectorAll(".convo").forEach((el) => el.onclick = (e) => { if (e.target.classList.contains("convo-rename")) return; switchSession(el.dataset.id); });
  list.querySelectorAll(".convo-rename").forEach((el) => el.onclick = (e) => {
    e.stopPropagation();
    startRename(el.closest(".convo"), el.dataset.id);
  });
}
function startRename(convo, id) {
  if (!convo) return;
  const titleSpan = convo.querySelector(".convo-title");
  if (!titleSpan) return;
  const current = titleSpan.textContent;
  const input = document.createElement("input");
  input.className = "convo-edit";
  input.value = current;
  titleSpan.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = async (commit) => {
    if (done) return; done = true;
    const name = (input.value || "").trim();
    if (commit && name && name !== current) {
      try {
        await fetch(API + "/chat/session/rename", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: id, title: name }) });
      } catch (e) {}
    }
    loadSessions();
  };
  input.onkeydown = (ev) => { if (ev.key === "Enter") { ev.preventDefault(); finish(true); } else if (ev.key === "Escape") { finish(false); } };
  input.onblur = () => finish(true);
  input.onclick = (ev) => ev.stopPropagation();
}
async function switchSession(id) {
  sessionId = id;
  localStorage.setItem("rebeca_sid", id.replace(/^dashboard:/, ""));
  await loadHistory();
  closeAllDrawers();
}
$("convosToggle").onclick = () => {
  const willOpen = !$("convos").classList.contains("open");
  $("side").classList.remove("open");
  $("convos").classList.toggle("open", willOpen);
  $("overlay").classList.toggle("show", willOpen);
  if (willOpen) loadSessions();
};
$("convosSearch").oninput = renderSessions;
$("convosNew").onclick = () => { newChat(); closeAllDrawers(); };
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });

async function loadHealth() {
  try {
    const h = await (await fetch(API + "/health")).json();
    $("healthDot").className = "dot ok";
    $("healthText").textContent = "en línea · " + h.llm;
  } catch {
    $("healthDot").className = "dot err";
    $("healthText").textContent = "sin conexión";
  }
}

async function loadCalendar() {
  try {
    const r = await (await fetch(API + "/widgets/calendar")).json();
    const events = r.events || [];
    if (!events.length) { $("calendar").innerHTML = '<span class="empty">Sin eventos próximos.</span>'; return; }
    $("calendar").innerHTML = events.map(e => {
      const inner = '<span class="t">' + esc(e.date || "") + '<br>' + esc(e.time || "") + '</span><span>' + esc(e.title || "") + '</span>';
      return e.url
        ? '<a class="cal-item" href="' + esc(e.url) + '" target="_blank" rel="noopener" title="Abrir en Google Calendar">' + inner + '</a>'
        : '<div class="cal-item">' + inner + '</div>';
    }).join("");
  } catch {
    $("calendar").innerHTML = '<span class="empty">Calendario no disponible.</span>';
  }
}

async function loadCaps() {
  try {
    const r = await (await fetch(API + "/tools")).json();
    const tools = r.tools || [];
    $("caps").innerHTML = tools.map(t => '<span class="cap" data-cmd="' + esc(t.name) + '" title="Insertar en el chat">' + esc(t.name) + "</span>").join("");
    $("caps").querySelectorAll(".cap[data-cmd]").forEach((el) => el.onclick = () => {
      const inp = $("input");
      inp.value = "/" + el.dataset.cmd + " ";
      inp.focus();
      inp.style.height = "auto"; inp.style.height = inp.scrollHeight + "px";
      closeAllDrawers(); // if opened from the mobile drawer, reveal the composer
    });
  } catch {
    $("caps").innerHTML = '<span class="empty">—</span>';
  }
}

async function loadGraph() {
  try {
    const g = await (await fetch(API + "/widgets/brain-graph")).json();
    const nodes = g.nodes || [];
    const links = (g.edges || []).map(e => ({ source: e.source, target: e.target }));
    $("graphHint").textContent = nodes.length + " nota(s) · " + links.length + " enlace(s)";
    const folders = [...new Set(nodes.map(n => n.folder || "root"))];
    const palette = ["#bcbf56", "#f27e63", "#bf6550", "#71734c", "#d8d8d8"];
    const colorOf = (f) => palette[folders.indexOf(f) % palette.length];
    const el = document.getElementById("graph");
    const Graph = ForceGraph()(el)
      .width(el.clientWidth).height(260)
      .backgroundColor("#0f0f0f")
      .nodeLabel(n => (n.title || n.id) + (n.tags && n.tags.length ? "  #" + n.tags.join(" #") : ""))
      .nodeColor(n => colorOf(n.folder || "root"))
      .nodeRelSize(5)
      .linkColor(() => "rgba(216,216,216,.35)")
      .graphData({ nodes, links });
    Graph.onNodeClick(n => { if (n.url) window.open(n.url, "_blank"); });
  } catch (err) {
    document.getElementById("graphHint").textContent = "Grafo no disponible.";
  }
}

// Restore the conversation on reload (backend keeps it per session).
async function loadHistory() {
  try {
    const r = await (await fetch(API + "/chat/history?session_id=" + encodeURIComponent(sessionId))).json();
    const msgs = r.messages || [];
    if (msgs.length) {
      messages.innerHTML = "";
      msgs.forEach((m) => addMsg(m.role === "user" ? "user" : "assistant", m.content));
      return true;
    }
  } catch (e) {}
  return false;
}
function newChat() {
  const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("rebeca_sid", id);
  sessionId = "dashboard:" + id;
  stopSpeaking();
  messages.innerHTML = "";
  addMsg("assistant", "Nueva conversación. ¿En qué te ayudo, Sebastian?");
}
// ── Model indicator (which model answered the last turn) ──
let lastRoute = "";
function shortModel(m) { return String(m || "").replace(/^claude-/, "").replace(/-\d{6,}$/, ""); }
function setModelChip(d) {
  if (!d) return;
  const model = d.model || d.provider || "";
  const host = d.host ? " @" + d.host : "";
  $("modelChip").innerHTML = (lastRoute ? esc(lastRoute) + " · " : "") + "<b>" + esc(shortModel(model)) + "</b>" + esc(host);
}

// ── Generic tool invocation (task widget + command palette) ──
async function invokeTool(name, input) {
  const r = await fetch(API + "/tools/invoke", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, input: input || {} }),
  });
  return r.json();
}

// ── Tasks (Linear) widget ──
async function loadTasks() {
  try {
    const r = await invokeTool("list_tasks", { limit: 15 });
    const tasks = (r && r.tasks) || [];
    if (r && r.ok === false) throw new Error(r.error || "error");
    if (!tasks.length) { $("tasks").innerHTML = '<span class="empty">Sin tareas.</span>'; return; }
    $("tasks").innerHTML = tasks.map((t) => {
      const done = t.type === "completed";
      const p1 = t.priority === 1 ? " p1" : "";
      const title = t.url ? '<a href="' + esc(t.url) + '" target="_blank" rel="noopener">' + esc(t.title) + "</a>" : esc(t.title);
      return '<div class="task' + p1 + '" data-id="' + esc(t.id) + '">' +
        '<div class="chk" title="Marcar hecha"' + (done ? ' style="background:var(--lime)"' : "") + "></div>" +
        '<div style="flex:1"><div class="tt">' + title + '</div><div class="st">' + esc(t.state || "") + "</div></div></div>";
    }).join("");
    $("tasks").querySelectorAll(".task .chk").forEach((el) => el.onclick = async () => {
      el.style.background = "var(--lime)";
      await invokeTool("complete_task", { id: el.closest(".task").dataset.id, state: "Done" });
      loadTasks();
    });
  } catch { $("tasks").innerHTML = '<span class="empty">Tareas no disponibles.</span>'; }
}

// ── Homelab / status widget ──
const HL_ABBR = { "CPU": "CPU", "RAM": "RAM", "Disk /": "Disk", "GPU util": "GPU", "GPU mem": "VRAM" };
async function loadHomelab() {
  try {
    const r = await (await fetch(API + "/widgets/homelab")).json();
    const svcs = r.services || [], panels = r.panels || [];
    // ── Left column: services (processes) ──
    let left = '<div class="hl-lbl">Servicios · ' + svcs.filter(s => s.up).length + "/" + svcs.length + " activos</div>";
    left += svcs.map((s) =>
      '<div class="svc"><span class="d ' + (s.up ? "up" : "down") + '"></span><span class="n">' + esc(s.name) + "</span></div>"
    ).join("");
    // ── Right column: resource bars, pivoted per node (scrollable) ──
    let right = '<div class="hl-lbl">Recursos</div>';
    if (!r.metricsEnabled) {
      right += '<div class="empty" style="font-size:12px">Configura PROMETHEUS_URL para ver CPU/RAM/GPU.</div>';
    } else {
      const nodes = {};
      for (const p of panels) {
        if (p.error) continue;
        for (const s of (p.series || [])) (nodes[s.name] = nodes[s.name] || []).push({ label: p.label, value: s.value, unit: p.unit || "" });
      }
      const names = Object.keys(nodes);
      if (!names.length) {
        right += '<div class="empty" style="font-size:12px">Sin datos (revisa exporters / nombres de métricas).</div>';
      } else {
        for (const n of names) {
          right += '<div class="hl-node"><div class="hl-name">' + esc(n) + '</div><div class="hl-bars">' +
            nodes[n].map((m) => {
              const v = Math.max(0, Math.min(100, m.value));
              const warn = v >= 85 ? "warn" : "";
              return '<div class="hl-b"><span class="k">' + esc(HL_ABBR[m.label] || m.label) + '</span>' +
                '<span class="bar"><i class="' + warn + '" style="width:' + v + '%"></i></span>' +
                '<span class="v">' + Math.round(m.value) + esc(m.unit || "") + "</span></div>";
            }).join("") + "</div></div>";
        }
      }
    }
    $("homelab").innerHTML = '<div class="hl-cols"><div class="hl-col-svc">' + left + '</div><div class="hl-col-res">' + right + "</div></div>";
  } catch { $("homelab").innerHTML = '<span class="empty">Estado no disponible.</span>'; }
}
$("tasksReload").onclick = loadTasks;

// ── Command palette (Ctrl-K / Cmd-K): fire any tool without typing a prompt ──
let palTools = [], palFiltered = [], palSel = 0, palMode = null;
async function ensurePalTools() { if (palTools.length) return; try { palTools = (await (await fetch(API + "/tools")).json()).tools || []; } catch {} }
function openPalette() { ensurePalTools().then(() => { palMode = null; $("paletteInput").value = ""; renderPalette(""); $("paletteWrap").classList.add("show"); $("paletteInput").focus(); }); }
function closePalette() { $("paletteWrap").classList.remove("show"); palMode = null; }
function renderPalette(q) {
  q = (q || "").toLowerCase();
  palFiltered = palTools.filter((t) => (t.name + " " + (t.description || "")).toLowerCase().includes(q));
  palSel = 0;
  $("paletteList").innerHTML = palFiltered.map((t, i) =>
    '<div class="pal-item' + (i === 0 ? " sel" : "") + '" data-i="' + i + '"><div class="pn">' + esc(t.name) + '</div><div class="pd">' + esc(t.description || "") + "</div></div>"
  ).join("") || '<div class="pal-item"><div class="pd">Sin coincidencias</div></div>';
  $("paletteList").querySelectorAll(".pal-item[data-i]").forEach((el) => el.onclick = () => chooseTool(palFiltered[+el.dataset.i]));
}
function chooseTool(t) {
  if (!t) return;
  const props = (t.input_schema && t.input_schema.properties) || {};
  const required = (t.input_schema && t.input_schema.required) || [];
  const keys = Object.keys(props);
  if (!keys.length) { runPaletteTool(t, {}); return; }
  palMode = { tool: t };
  $("paletteList").innerHTML = keys.map((k) =>
    '<div class="pal-field"><label>' + esc(k) + (required.includes(k) ? " *" : "") + '</label>' +
    '<input data-k="' + esc(k) + '" placeholder="' + esc((props[k].description || "").slice(0, 60)) + '"/></div>'
  ).join("") + '<div class="pal-item sel" id="palRun"><div class="pn">▶ Ejecutar ' + esc(t.name) + "</div></div>";
  const first = $("paletteList").querySelector("input"); if (first) first.focus();
  $("palRun").onclick = () => submitPaletteForm(t, required);
  $("paletteList").querySelectorAll(".pal-field input").forEach((inp) => inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); submitPaletteForm(t, required); } });
}
function submitPaletteForm(t, required) {
  const input = {};
  $("paletteList").querySelectorAll(".pal-field input").forEach((inp) => { const v = inp.value.trim(); if (v) input[inp.dataset.k] = v; });
  for (const req of required) {
    if (!input[req]) { const el = $("paletteList").querySelector('input[data-k="' + req + '"]'); if (el) { el.style.borderColor = "var(--coral)"; el.focus(); } return; }
  }
  runPaletteTool(t, input);
}
async function runPaletteTool(t, input) {
  closePalette();
  addTool(t.name, "→ ejecutando");
  try {
    const res = await invokeTool(t.name, input);
    const summary = (res && (res.result || res.answer)) ? (res.result || res.answer) : JSON.stringify(res);
    addMsg("assistant", "✓ " + t.name + ": " + String(summary).slice(0, 600));
  } catch (e) { addMsg("assistant", "⚠ " + t.name + " falló: " + e.message); }
  loadCalendar(); loadTasks(); loadHomelab();
}
function updateSel(items) { items.forEach((el, i) => el.classList.toggle("sel", i === palSel)); if (items[palSel]) items[palSel].scrollIntoView({ block: "nearest" }); }
$("paletteInput").oninput = (e) => { if (!palMode) renderPalette(e.target.value); };
$("paletteInput").onkeydown = (e) => {
  if (e.key === "Escape") { closePalette(); return; }
  if (palMode) return;
  const items = $("paletteList").querySelectorAll(".pal-item[data-i]");
  if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palSel + 1, items.length - 1); updateSel(items); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(palSel - 1, 0); updateSel(items); }
  else if (e.key === "Enter") { e.preventDefault(); chooseTool(palFiltered[palSel]); }
};
$("paletteWrap").onclick = (e) => { if (e.target.id === "paletteWrap") closePalette(); };
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
    e.preventDefault();
    $("paletteWrap").classList.contains("show") ? closePalette() : openPalette();
  }
});

loadHistory().then((had) => { if (!had) addMsg("assistant", "Hola Sebastian 👋 Soy Rebeca. ¿En qué te ayudo hoy?"); });
loadHealth(); loadCalendar(); loadCaps(); loadGraph(); loadTasks(); loadHomelab();
setInterval(loadHealth, 30000);
setInterval(loadCalendar, 300000); // keep upcoming events fresh (every 5 min)
setInterval(loadHomelab, 30000);   // refresh homelab status
</script>
